name: spooky_ai
description: "🎃 SpookyAI - AI-Powered Halloween Image Generator. Transform your photos into spooky Halloween masterpieces with the power of AI!"
publish_to: 'none'

# Version: Major.Minor.Patch+Build
# Major: Breaking changes
# Minor: New features, backward compatible  
# Patch: Bug fixes, backward compatible
# Build: Incremental build number
version: 2.0.0+20

environment:
  sdk: ^3.10.0-158.0.dev

# Core Dependencies
dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # HTTP & Networking
  http: ^1.2.2
  
  # Image & Media
  image_picker: ^1.0.7
  gal: ^2.3.0
  
  # Storage & Preferences
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  
  # Permissions & System
  permission_handler: ^11.3.1
  device_info_plus: ^11.1.0
  
  # Sharing & Social
  share_plus: ^10.0.2
  video_player: ^2.9.2
  
  # Animations
  lottie: ^3.1.2
  
  # State Management
  provider: ^6.1.2
  
  # In-App Purchases
  # RevenueCat (bundles Play Billing 8 and StoreKit 2)
  
  # Quick Actions (App Shortcuts)
  quick_actions: ^1.1.0
  
  # URL Launcher
  url_launcher: ^6.2.4
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # App Info & Version
  package_info_plus: ^8.0.0
  purchases_flutter: ^11.0.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  video_thumbnail: ^0.5.6
  in_app_review: ^2.0.12
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

# Development Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Code Quality
  flutter_lints: ^6.0.0
  
  # App Icons
  flutter_launcher_icons: ^0.13.1

# Flutter Configuration

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/images/haloween/text-to-image/
    - assets/images/haloween/image-to-image/
    - assets/images/haloween/image-to-video/
    - assets/images/christmas/text-to-image/
    - assets/images/christmas/image-to-image/
    - assets/images/trends/
    - assets/icons/
    - assets/lottie/
    - assets/prompt_previews/
    - assets/sounds/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon_christmas.png
  adaptive_icon_background: "#0F0B1A"
  remove_alpha_ios: true
