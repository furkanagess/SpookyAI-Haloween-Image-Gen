name = "spookyai-fal-proxy"
main = "worker.mjs"
compatibility_date = "2025-01-01"

# Secrets (never put these in this file):
#   wrangler secret put FAL_KEY      # your NEW fal key
#   wrangler secret put APP_TOKEN    # random string; the app sends it as X-App-Token
# Kill switch: set the variable DISABLED to "1" in the dashboard (or `wrangler deploy --var DISABLED:1`).

# Optional per-IP rate limit. Verify the current syntax in Cloudflare's docs
# ("Rate Limiting binding") before enabling:
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }

# Free-token trial ledger (one grant per device, see claimTrial in worker.mjs).
#   wrangler kv namespace create TRIALS     -> paste the id below
#   wrangler secret put TRIAL_SALT          # random string, never change it
# Without this binding /trial/claim answers 501 and the app falls back to its
# on-device check.
# [[kv_namespaces]]
# binding = "TRIALS"
# id = "<namespace id>"
