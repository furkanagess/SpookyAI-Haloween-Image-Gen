<!doctype html><html><head><meta charset="utf-8"><title>SpookyAI Header</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:823px;overflow:hidden;background:#0F0B1A;color:#fff;font-family:Inter}
.glow{position:absolute;border-radius:50%;filter:blur(130px)}
.card{position:absolute;border-radius:30px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.14)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.c{position:absolute;left:560px;right:560px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10}
.logo{display:flex;align-items:center;gap:16px;font:800 40px 'Bricolage Grotesque';margin-bottom:34px}
.logo img{width:74px;height:74px;border-radius:20px;box-shadow:0 10px 30px rgba(255,106,0,.45)}
h1{font:800 104px/.95 'Bricolage Grotesque';letter-spacing:-.035em;text-shadow:0 10px 40px rgba(0,0,0,.6)}
h1 em{font-style:normal;background:linear-gradient(90deg,#FF6A00,#FF4F9A 30%,#B25AFF 55%,#4FC3F7 80%,#5BD16A);-webkit-background-clip:text;color:transparent}
.sub{font:600 27px/1.4 Inter;color:#D3C6E6;margin-top:28px}
.sub b{color:#FF9A1F;margin:0 12px}
.orb{position:absolute;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:11}
.shade{position:absolute;top:0;bottom:0;width:820px;left:550px;background:radial-gradient(ellipse at center,rgba(15,11,26,.85) 0%,rgba(15,11,26,.55) 45%,transparent 72%);z-index:5}
