<!doctype html><html><head><meta charset="utf-8"><title>SpookyAI Search Visual</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1280px;overflow:hidden;background:#0D0917;color:#fff;font-family:Inter}
.glow{position:absolute;border-radius:50%;filter:blur(150px)}
.card{position:absolute;border-radius:40px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.14)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:26px;left:26px;padding:12px 24px;border-radius:999px;font:800 24px Inter;letter-spacing:.16em}
.before{background:rgba(255,255,255,.92);color:#140f22}
.after{background:linear-gradient(90deg,#FF6A00,#FF9A1F);color:#fff;box-shadow:0 10px 30px rgba(255,106,0,.5)}
.name{position:absolute;left:0;right:0;bottom:0;padding:90px 34px 32px;background:linear-gradient(transparent,rgba(0,0,0,.85));font:800 40px 'Bricolage Grotesque'}
.copy{position:absolute;left:130px;top:0;bottom:0;width:820px;display:flex;flex-direction:column;justify-content:center;z-index:10}
h1{font:800 150px/.93 'Bricolage Grotesque';letter-spacing:-.04em}
h1 em{font-style:normal;background:linear-gradient(90deg,#FF6A00,#FF9A1F 40%,#B25AFF);-webkit-background-clip:text;color:transparent}
.sub{font:600 38px/1.4 Inter;color:#D3C6E6;margin-top:44px;max-width:740px}
.rule{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#FF6A00,#B25AFF);margin-bottom:54px}
.looks{display:flex;gap:16px;margin-top:56px;flex-wrap:wrap;max-width:760px}
.looks span{font:700 26px Inter;color:#fff;padding:14px 26px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.link{position:absolute;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.9),#FF6A00);z-index:6;box-shadow:0 0 24px rgba(255,106,0,.7)}
</style></head><body>
<div class="glow" style="width:1100px;height:1100px;background:#B25AFF;left:1000px;top:-400px;opacity:.42"></div>
<div class="glow" style="width:1000px;height:1000px;background:#FF6A00;left:1150px;top:600px;opacity:.38"></div>
<div class="glow" style="width:800px;height:800px;background:#3a1f6a;left:-300px;top:500px;opacity:.6"></div>

<div class="copy">
 <div class="rule"></div>
 <h1>One Selfie.<br><em>Endless<br>Looks.</em></h1>
 <div class="sub">AI turns your photo into stunning Halloween, Christmas &amp; seasonal portraits in seconds.</div>
 <div class="looks"><span>Witch</span><span>Ice Queen</span><span>Skeleton Glam</span></div>
</div>

<!-- side looks -->
<div class="card" style="width:330px;height:500px;left:1590px;top:120px;transform:rotate(7deg)"><img src="C/image-to-image/ice_queen.jpg"></div>
<div class="card" style="width:330px;height:500px;left:1610px;top:670px;transform:rotate(-5deg)"><img src="H/image-to-image/skeleton_makeup.png"></div>
<!-- hero after -->
<div class="card" style="width:620px;height:1060px;left:1030px;top:110px;z-index:4;box-shadow:0 50px 110px rgba(0,0,0,.75),0 0 0 4px #FF6A00,0 0 120px rgba(255,106,0,.45)"><img src="H/image-to-image/enchantedd_witch.png"><span class="tag after">AFTER</span><div class="name" style="text-align:right">Enchanted Witch</div></div>
<!-- before -->
<div class="card" style="width:330px;height:470px;left:830px;top:640px;z-index:7;transform:rotate(-5deg);box-shadow:0 40px 90px rgba(0,0,0,.75),0 0 0 6px #fff"><img src="R/girl.jpeg" style="filter:saturate(.9)"><span class="tag before">BEFORE</span></div>
</body></html>
